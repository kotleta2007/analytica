# nginx server block for Habitica Analytica. Copy to
# /etc/nginx/sites-available/analytica, replace the host, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`, then let certbot add
# the TLS lines: `certbot --nginx -d bot.example.com`.
#
# The app listens on 127.0.0.1:8000 only (docker-compose.yml); nothing else
# is exposed.

server {
    listen 80;
    listen [::]:80;
    server_name bot.example.com;

    # Telegram voice notes go through here; a long one is a few MB. Habitica
    # webhook payloads are small. 25M leaves room without inviting abuse.
    client_max_body_size 25M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An LLM turn with tools takes seconds; leave headroom rather than 504
    # on a slow model.
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    # Both webhook URLs carry WEBHOOK_SECRET in the path; keep them out of
    # the access log.
    location /webhooks/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }
}
