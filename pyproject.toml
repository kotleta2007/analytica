[project]
name = "analytica"
version = "0.1.0"
description = "Telemetry, analytics and coaching for Habitica, through a Telegram bot you can talk to"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "apscheduler>=3.11",
    "fastapi>=0.115",
    "google-auth>=2.37",
    "httpx>=0.28",
    "matplotlib>=3.10",
    "openai>=1.59",
    "plotext>=5.3,<6",
    "polars>=1.19",
    "pydantic-settings>=2.7",
    "seaborn>=0.13",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# CLAUDE.md and GAMEPLAN.md are specs: ruff must not reformat their code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
